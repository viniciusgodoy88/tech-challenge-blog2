name: CI/CD Pipeline - Back-End

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. SOBE O CONTAINER DO POSTGRESQL PARA OS TESTES
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: blogdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # 2. RODA AS MIGRATIONS NO BANCO ANTES DE RODAR OS TESTES
      - name: Rodar Prisma Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/blogdb?schema=public"
        run: npx prisma migrate dev --name init

      # 3. EXECUTA OS TESTES DO JEST
      - name: Executar Testes com Jest
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/blogdb?schema=public"
          JWT_SECRET: "test_secret_key"
        run: npm test
